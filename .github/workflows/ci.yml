name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . pytest ruff
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Dogfood (examples behave as documented)
        run: |
          test "$(llmjson -r examples/python_style.txt)" = '{"ok":true,"error":null,"tags":["a","b"]}'
          llmjson -r examples/deepseek_r1.txt | python -c 'import json,sys; assert len(json.load(sys.stdin)["cities"]) == 3'
          llmjson -r examples/truncated.txt
          if llmjson examples/refusal.txt; then exit 1; fi
          if llmjson --strict examples/deepseek_r1.txt; then exit 1; fi
          sh examples/pipeline.sh
          python examples/library.py
